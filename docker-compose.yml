# Our own Postgres. Zetaris runs separately from its zetaris-platform bundle and reads this
# database as a registered source (db/zetaris_register.sql). Port 5433 avoids clashing with
# Zetaris's internal postgres.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: trialmatch
      POSTGRES_PASSWORD: trialmatch
      POSTGRES_DB: trialmatch
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
volumes:
  pgdata:
